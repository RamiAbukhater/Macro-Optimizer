[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-optimizer"
version = "0.2.0"
description = "Cost-minimizing meal planning against macro and budget targets."
requires-python = ">=3.9"
dependencies = [
    "pulp>=2.7.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
macro_optimizer = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# This checkout's src first, so a worktree tests its own code, not an editable install elsewhere.
pythonpath = ["src"]
