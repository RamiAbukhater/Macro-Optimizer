<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macro Optimizer</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="page page-narrow">
  <div class="eyebrow">Macro Optimizer</div>
  <h1>Tell us about you</h1>
  <p>We'll turn this into daily macro targets and build a suggested weekly menu around them.</p>

  <div class="error-banner" id="error-banner"></div>

  <form class="card" id="profile-form">
    <div class="field">
      <label for="sex">Sex</label>
      <select id="sex" required>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="age">Age</label>
        <input type="number" id="age" min="13" max="100" value="25" required>
      </div>
      <div class="field">
        <label for="weight_lbs">Weight (lb)</label>
        <input type="number" id="weight_lbs" min="60" max="500" value="170" required>
      </div>
    </div>

    <div class="field">
      <label>Height</label>
      <div class="field-row">
        <div class="field">
          <input type="number" id="height_ft" min="3" max="8" value="5" required aria-label="Feet">
          <div class="help-text">feet</div>
        </div>
        <div class="field">
          <input type="number" id="height_in" min="0" max="11" value="10" required aria-label="Inches">
          <div class="help-text">inches</div>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="activity">Daily activity level</label>
      <select id="activity" required>
        <option value="sedentary">Sedentary — little or no exercise</option>
        <option value="light">Lightly active — light exercise 1-3 days/week</option>
        <option value="moderate" selected>Moderately active — moderate exercise 3-5 days/week</option>
        <option value="active">Very active — hard exercise 6-7 days/week</option>
        <option value="very_active">Extremely active — very hard training or physical job</option>
      </select>
    </div>

    <div class="field">
      <label>Goal</label>
      <div class="goal-cards" id="goal-cards">
        <div class="goal-card" data-value="lose_fat">Lose Fat</div>
        <div class="goal-card selected" data-value="maintain">Maintain</div>
        <div class="goal-card" data-value="gain_muscle">Gain Muscle</div>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="budget">Daily food budget ($)</label>
        <input type="number" id="budget" min="5" max="200" value="25" step="0.5" required>
      </div>
      <div class="field">
        <label for="cook_time">Time to cook per day</label>
        <select id="cook_time">
          <option value="low">Not much (~20 min)</option>
          <option value="medium" selected>Some (~45 min)</option>
          <option value="high">Plenty (~90 min)</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Dietary preferences <span style="font-weight: 400; color: var(--text-muted);">(optional)</span></label>
      <div class="checkbox-row"><input type="checkbox" id="f-vegetarian"><label for="f-vegetarian">Vegetarian</label></div>
      <div class="checkbox-row"><input type="checkbox" id="f-vegan"><label for="f-vegan">Vegan</label></div>
      <div class="checkbox-row"><input type="checkbox" id="f-halal"><label for="f-halal">Halal</label></div>
      <div class="checkbox-row"><input type="checkbox" id="f-gluten_free"><label for="f-gluten_free">Gluten-free</label></div>
      <div class="checkbox-row"><input type="checkbox" id="f-no_pork"><label for="f-no_pork">No pork</label></div>
    </div>

    <button type="submit" class="primary" id="submit-btn">Build my plan</button>
  </form>
</div>

<script src="/js/onboarding.js"></script>
</body>
</html>
