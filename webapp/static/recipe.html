<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe9dc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)">
<title>Recipe · AutoEat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon.svg">
</head>
<body>
<div class="shell">
  <div class="sidebar" id="sidebar-mount"></div>

  <div class="main" id="recipe-root" style="display:none;">
    <a href="#" id="back-link" class="back-link"><span class="back-icon"></span>Back</a>

    <div class="recipe-hero">
      <div>
        <div class="eyebrow" id="recipe-eyebrow"></div>
        <h1 id="recipe-title"></h1>
        <div id="recipe-badges" class="flag-row"></div>
      </div>
      <div class="recipe-price">
        <div class="stat-label">Price / serving</div>
        <div class="stat-value" id="recipe-price"></div>
      </div>
    </div>

    <div class="stat-row" id="macro-row"></div>

    <div class="card" id="ingredients-card" style="display:none;">
      <div class="section-title">
        <h2>Ingredients</h2>
        <span class="hint" id="servings-hint"></span>
      </div>
      <div id="ingredients-list"></div>
    </div>

    <div class="card" id="notes-card" style="display:none;">
      <div class="section-title"><h2>Notes</h2></div>
      <p id="notes-text" style="margin:0;"></p>
    </div>

    <div class="card" id="source-card" style="display:none;">
      <div class="section-title"><h2>Source</h2></div>
      <div id="source-body"></div>
    </div>
  </div>

  <div class="main" id="recipe-error" style="display:none;">
    <div class="empty-state"><span id="error-text"></span></div>
  </div>
</div>

<div class="loading-overlay" id="loading"><span class="spinner"></span>Loading…</div>

<script src="/js/pwa.js"></script>
<script src="/js/common.js"></script>
<script src="/js/recipe.js"></script>
</body>
</html>
