<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fridge · AutoEat</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="shell">
  <div class="sidebar" id="sidebar-mount"></div>

  <div class="main" id="fridge-root">
    <div class="topbar">
      <div>
        <div class="eyebrow">Fridge</div>
        <h1>Your inventory</h1>
        <p style="margin:0;">What's already on hand gets applied as a discount against recipe cost &amp; the shopping list.</p>
      </div>
    </div>

    <div id="expiring-banner"></div>

    <div class="card">
      <div class="section-title">
        <h2>Add or update an item</h2>
      </div>
      <form id="pantry-form">
        <div class="field-row">
          <div class="field" style="flex: 2;">
            <label for="ingredient-select">Ingredient</label>
            <select id="ingredient-select" required></select>
          </div>
          <div class="field">
            <label for="quantity-input">Quantity <span id="unit-label" style="font-weight:400;color:var(--text-muted);"></span></label>
            <input type="number" id="quantity-input" min="0" step="any" required>
          </div>
          <div class="field">
            <label for="expiry-input">Expires on <span style="font-weight:400;color:var(--text-muted);">(optional)</span></label>
            <input type="date" id="expiry-input">
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="pantry-submit"><span class="pantry-plus-icon"></span>Save to fridge</button>
      </form>
    </div>

    <div class="card card-flush">
      <div style="padding: 22px 22px 16px;">
        <div class="section-title" style="margin-bottom:0;">
          <h2>Currently tracked</h2>
          <span class="hint" id="item-count-hint"></span>
        </div>
      </div>
      <div id="pantry-table-wrap"></div>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/fridge.js"></script>
</body>
</html>
