<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe9dc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)">
<title>Cost Analysis · AutoEat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon.svg">
</head>
<body>
<div class="shell">
  <div class="sidebar" id="sidebar-mount"></div>

  <div class="main" id="cost-root" style="display:none;">
    <div class="topbar">
      <div>
        <div class="eyebrow">Cost Analysis</div>
        <h1>Budget &amp; shopping list</h1>
        <p>What this week costs, where it goes, and what to actually buy.</p>
      </div>
    </div>

    <div class="stat-row" id="stat-row"></div>

    <div class="card">
      <div class="section-title">
        <h2>Budget &amp; channel mix</h2>
        <span class="hint">Full week</span>
      </div>
      <div class="meter-row">
        <div class="meter-label">
          <span class="name">Weekly budget used</span>
          <span class="value" id="budget-meter-value"></span>
        </div>
        <div class="meter-track"><div class="meter-fill" id="budget-meter-fill" style="background: var(--ink);"></div></div>
      </div>
      <div id="channel-bars"></div>
    </div>

    <div class="card">
      <div class="section-title">
        <h2>Shopping list</h2>
        <span class="hint">Recipe ingredients and market items, minus what's in your fridge</span>
      </div>
      <div class="actions" style="margin-bottom:22px;">
        <button class="btn btn-secondary" id="export-human-btn"><span class="export-icon"></span>Plain text (.txt)</button>
        <button class="btn btn-secondary" id="export-instacart-btn"><span class="export-icon"></span>Instacart format (.json)</button>
      </div>
      <div id="shopping-list-body"></div>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loading"><span class="spinner"></span>Loading cost analysis…</div>

<script src="/js/pwa.js"></script>
<script src="/js/common.js"></script>
<script src="/js/cost.js"></script>
</body>
</html>
